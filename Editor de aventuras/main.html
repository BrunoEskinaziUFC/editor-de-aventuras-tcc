<!DOCTYPE html>
<html lang="pt-BR">

        <style type="text/css">

            #infobox{
                min-width: 25%;
                max-width: 25%;
                
             }
             #infobox-text{
                min-width: 75%;
                width:max-content;
             }

             #save-infobox {
                background-color: transparent;
                border: black;
                border-style: solid;
                border-width: 1px;
                border-radius: 15px;
                box-sizing: content-box;
                cursor: pointer;
                float: top;
                font-family: verdana;
                font-size: 12px;
                margin-left: -18%;
                padding: 1px 8px 1px 8px;
                
             }

             #save-infobox:hover {
                box-shadow: 1px 1px 8px rgba(0,0,0,.2);
             }

             #mynetwork {
                display: flex;
                 width: 70%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             #header {
                padding-left: 0.4%;
             }

             #graph-input{
                margin-bottom: 5px;
             }

             #graph-input label{
                border: black;
                border-style: solid;
                border-radius: 15px;
                border-width: 1px;
                padding: 0px 8px 1px 8px;
                margin-bottom: 0px; 
             }

             #color-node{
                margin-top: 0px;
                margin-left: 0%;
             }

             #image-node{
                border: black;
                border-style: solid;
                border-width: 1px;
                border-radius: 15px;
             }
             #label-node{
                margin-bottom: 3px;
             }
             #image-node{
                
             }

             .button-style {
                border: black;
                border-style: solid;
                border-radius: 15px;
                border-width: 1px;
                padding: 3px 3px 3px 3px;
                margin-top: 5px;
                margin-bottom: 6px;
                margin-left: 3px;
                 
             }

             .card {
                flex-direction: row;
                margin-left: 3px;
                
             }

             
             #config {
                 width: 400px;
                 height: 600px;
             }
             

             
        </style>

        <script src="./events.js"></script>
    </head>


    <body>
        <div id="header">
            <h1>Editor de Aventuras</h1>    
            <form id="graph-input" method="post" enctype=multipart/form-data>
                <button type="submit" class="button-style">Importar Grafo</button>
                <label for="file-graph-input" hidden="true">Arquivo do Grafo</label><input type="file" name="fileInput" id="file-graph-input" accept=".json" required><br>
                
            </form>
            <button id="graph-output" class="button-style">Baixar Grafo</button>
            <nav>
                <button id="button-select" hidden="true">Selecionar</button>
                <button id="button-cluster" hidden="true">Agrupamento</button>
            </nav>

        </div>
        <div class="card" style="width: 100%">  
            <div id="mynetwork" class="card-body"></div>
            <div id="infobox">
                <h3>Caixa de Informações</h3>
                <input id="label-node" type="text">
                <input id="color-node" type="color">
                <label for="image-node" class="button-style">Imagem</label><input id="image-node" type="file" hidden>
                <button id="image-remover" class="button-style">Sem Imagem</button>
                <textarea id="infobox-text" style="height: 300px;"></textarea>
                <button id="save-infobox">Salvar</button>
                
                
                
            </div>

        </div>

        
        <button id="button-config" class="button-style">Configurações</button>
        <div id="config"></div>
        

        <script type="text/javascript">
            // Código gerado pelo pyvis
              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": 5, "label": "5", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": 2, "label": "2", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": 1, "label": "1", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": 3, "label": "3", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": 0, "label": "0", "shape": "dot", "size": 10}]);
                  edges = new vis.DataSet([{"from": 5, "to": 2, "width": 1}, {"from": 2, "to": 1, "width": 1}, {"from": 3, "to": 2, "width": 1}, {"from": 3, "to": 0, "width": 1}, {"from": 3, "to": 5, "width": 1}, {"from": 1, "to": 0, "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
                        "configure": {
                            "enabled": true
                        },
                        "edges": {
                            "color": {
                                "inherit": true
                            },
                            "smooth": {
                                "enabled": true,
                                "type": "dynamic"
                            }
                        },
                        "interaction": {
                            "dragNodes": true,
                            "hideEdgesOnDrag": false,
                            "hideNodesOnDrag": false
                        },
                        "physics": {
                            "enabled": true,
                            "stabilization": {
                                "enabled": true,
                                "fit": true,
                                "iterations": 1000,
                                "onlyDynamicEdges": false,
                                "updateInterval": 50
                            }
                        }
                };
                  // Ativar modo de edi��o
                  options.manipulation = {
                    'enabled': true,
                    'addNode': function(nodeData, callback){
                        nodeData.label = "novo!";
                        callback(nodeData)
                    },
                    'editNode': function(nodeData, callback) {
                        var infobox = document.getElementById('infobox-text')
                        edit(nodeData)
                        
                        callback(nodeData)
                        
                    }
                  }
                  //console.log("Options: ");
                  //console.log(options);
                  
                  options.edges = {'arrows': {'to': {'enabled': true}} }


                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  
                  network = new vis.Network(container, data, options);

                  return network;

              }
              //drawGraph();
              //startEvents(network);
              //console.log(network);
              
        </script>
        <script type="text/javascript" src="./createGraph.js"></script>
        <script type="text/javascript" src="./exportGraph.js"></script>
    </body>
</html>
